services:

    nginx:
        image: jc21/nginx-proxy-manager:latest
        container_name: Rexial_Nginx
        restart: always
        ports:
            - "80:80"
            - "443:443"
            - "81:81"

        volumes:
            - nginx_data:/data
            - letsencrypt:/etc/letsencrypt

        networks:
            - rexial-network

        depends_on:
            - frontend
            - backend
            - ws-server
            - genai

    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile.prod
        image: codeheist/rexial-frontend:${IMAGE_TAG:-latest}
        container_name: rexial-frontend-prod
        restart: always
        networks:
            - rexial-network
        depends_on:
            - backend
            - ws-server
            - genai

    backend:
        build:
            context: .
            dockerfile: apps/http-server/Dockerfile.prod
            args:
                DATABASE_URL: ${DATABASE_URL}
        image: codeheist/rexial-http-server:${IMAGE_TAG:-latest}
        container_name: rexial-http-server-prod
        restart: always
        env_file:
            - .env.prod

        networks:
            - rexial-network
        # PostgreSQL and Redis run on the host, not in Docker. This maps
        # host.docker.internal to the docker bridge gateway so .env.prod can
        # address them; there is no db service to depend_on.
        extra_hosts:
            - "host.docker.internal:host-gateway"

        # now run the migrations
        command: >
            sh -c "pnpm --filter @repo/db run db:generate:prod &&
                   pnpm --filter @repo/db run db:migrate &&
                   pnpm run start"

    ws-server:
        build:
            context: .
            dockerfile: apps/ws-server/Dockerfile.prod
            args:
                DATABASE_URL: ${DATABASE_URL}
        image: codeheist/rexial-ws-server:${IMAGE_TAG:-latest}
        container_name: rexial-ws-server-prod
        restart: always
        env_file:
            - .env.prod
        networks:
            - rexial-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        command: >
            sh -c "pnpm --filter @repo/db run db:generate:prod &&
                   pnpm run start"

    genai:
        build:
            context: .
            dockerfile: apps/genAI/Dockerfile.prod
        image: codeheist/rexial-genai:${IMAGE_TAG:-latest}
        container_name: rexial-genai-prod
        restart: always
        env_file:
            - .env.prod
        environment:
            - UPLOAD_DIR=/data/uploads
        volumes:
            - genai_uploads:/data/uploads
        networks:
            - rexial-network
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s

    # No db or redis services: PostgreSQL and Redis are installed on the host
    # via apt and reached through host.docker.internal. See VPS-DEPLOYMENT.md
    # steps 3-5 for the host config (bind the docker bridge, firewall rules).

networks:
    rexial-network:
        driver: bridge

volumes:
    genai_uploads:
    nginx_data:
    letsencrypt:
